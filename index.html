<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Free</title>
<style>
:root{--bg:#faf9f5;--surface:#fff;--ink:#1f1e1d;--mute:#73726c;--line:#e8e6dc;--accent:#d97757;--bubble:#f0eee6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--surface:#30302e;--ink:#f5f4ee;--mute:#a3a29a;--line:#44433f;--bubble:#3a3936;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#262624;--surface:#30302e;--ink:#f5f4ee;--mute:#a3a29a;--line:#44433f;--bubble:#3a3936;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;justify-content:center;padding:12px;position:relative;z-index:5}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.pill:active{transform:scale(.95)}
.pill svg{transition:transform .3s}
.pill.open svg{transform:rotate(180deg)}
.menu{position:absolute;top:58px;width:min(320px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.15);opacity:0;transform:translateY(-10px) scale(.96);transform-origin:top center;pointer-events:none;transition:opacity .22s,transform .25s cubic-bezier(.2,.9,.3,1.2)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border-radius:12px;text-align:left;transition:background .15s,transform .15s}
.opt:hover{background:var(--bubble)}
.opt:active{transform:scale(.97)}
.opt small{display:block;color:var(--mute);font-size:12px;font-family:system-ui,sans-serif}
.opt .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .25s}
.opt.sel .dot{transform:scale(1)}
#chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.empty{margin:auto;text-align:center;color:var(--mute);font-size:24px;line-height:1.3;animation:fade .6s}
.msg{max-width:88%;line-height:1.55;font-size:16px;animation:pop .35s cubic-bezier(.2,.9,.3,1.1);white-space:pre-wrap}
.me{align-self:flex-end;background:var(--bubble);padding:10px 14px;border-radius:18px 18px 4px 18px}
.ai{align-self:flex-start}
.ai b{display:block;font-size:12px;color:var(--mute);font-family:system-ui,sans-serif;font-weight:500;margin-bottom:2px}
.att{display:inline-block;font:12px system-ui,sans-serif;padding:3px 8px;border-radius:8px;background:var(--line);margin:0 4px 6px 0}
.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--accent);animation:bounce 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.composer{max-width:760px;width:100%;margin:0 auto;padding:8px 12px 12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:10px 12px;transition:box-shadow .2s,border-color .2s}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.18)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips .att{margin:0 0 8px;animation:pop .25s}
textarea{width:100%;border:0;outline:0;resize:none;background:none;color:inherit;font:16px/1.4 Georgia,serif;max-height:140px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .15s,background .2s}
.ic:active{transform:scale(.88)}
.ic:hover{background:var(--bubble)}
#send{background:var(--accent);color:#fff}
#send:disabled{opacity:.35}
.burger{position:absolute;left:12px;top:12px}
#side{position:fixed;top:0;bottom:0;left:0;width:min(300px,86%);background:var(--surface);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:20;display:flex;flex-direction:column;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#side.show{transform:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:15}
#ov.show{opacity:1;pointer-events:auto}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font-family:system-ui,sans-serif;font-size:15px}
.item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,transform .15s;font-family:system-ui,sans-serif;font-size:15px}
.item:hover{background:var(--bubble)}.item:active{transform:scale(.97)}
.plus{color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--bubble);border-radius:12px;padding:3px}
.tab{flex:1;padding:8px;border-radius:9px;font:14px system-ui,sans-serif;transition:background .2s}
.tab.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rw{display:flex;align-items:center;border-radius:10px;animation:pop .3s}
.rw.act{background:var(--bubble)}
.rw.sub{margin-left:14px}
.x{width:30px;height:30px;color:var(--mute);border-radius:50%;flex:none}
.x:hover{background:var(--line)}
.hint{color:var(--mute);padding:10px 12px;font-size:14px}
.pinp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--bg);color:inherit;font:15px system-ui,sans-serif;outline:0;animation:pop .25s}
.eff{padding:10px 16px 6px;border-top:1px solid var(--line);margin-top:4px;font-family:system-ui,sans-serif}
.elab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.elab b{color:var(--ink);font-weight:600}
.hit{padding:26px 8px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.trk{position:relative;height:7px;border-radius:4px;background:var(--line);transition:height .25s cubic-bezier(.2,.9,.3,1.4),border-radius .25s}
.hit.down .trk{height:15px;border-radius:8px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--accent);transition:width .2s}
.tk{position:absolute;top:50%;width:4px;height:4px;border-radius:50%;background:var(--mute);opacity:.5;transform:translate(-50%,-50%)}
.thumb{position:absolute;top:50%;width:27px;height:27px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);transform:translate(-50%,-50%) scale(1);transition:left .2s cubic-bezier(.2,.9,.3,1.2),transform .25s cubic-bezier(.2,.9,.3,1.5)}
.hit.down .thumb{transform:translate(-50%,-50%) scale(1.25)}
.gl{position:absolute;right:12px;top:12px}
.menu.sm{right:12px;transform-origin:top right}
.sh{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 12px;font-family:system-ui,sans-serif}
.rf.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a.opt{text-decoration:none;color:inherit}
#slist{max-height:55vh;overflow-y:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="burger ic" id="burger" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="gl ic" id="gl" aria-label="Сайты"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
  <div class="menu sm" id="smenu"><div class="elab sh"><span>Сайты с бесплатными моделями</span><button class="ic rf" id="rf" aria-label="Обновить"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button></div><div id="slist"></div></div>
  <button class="pill" id="pill" aria-haspopup="true"><span id="mname">Fable 5.1</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="menu" id="menu"><div id="mopts"></div><div class="eff"><div class="elab"><span>Усилие</span><b id="elv"></b></div><div class="hit" id="hit"><div class="trk" id="trk"><div class="fill" id="fill"></div><i class="tk" style="left:25%"></i><i class="tk" style="left:50%"></i><i class="tk" style="left:75%"></i><div class="thumb" id="thumb"></div></div></div></div></div>
</header>
<aside id="side"><button class="item plus" id="nc">+ Новый чат</button><div class="tabs"><button id="tc" class="tab on">Чаты</button><button id="tp" class="tab">Проекты</button></div><div id="list"></div></aside><div id="ov"></div>
<div id="chat"><div class="empty" id="empty">Привет! О чём поговорим?</div></div>
<div class="composer"><div class="box">
  <div id="chips"></div>
  <textarea id="inp" rows="1" placeholder="Напишите сообщение"></textarea>
  <div class="row">
    <button class="ic" id="plus" aria-label="Прикрепить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ic" id="send" disabled aria-label="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <input type="file" id="file" multiple accept="image/*,video/*,.pdf,.txt,.doc,.docx" hidden>
</div></div>
<script>
var models=[["Fable 5.1","Самая мощная"],["Opus 5.5","Сложные задачи"],["Sonnet 5.5","Баланс скорости и ума"],["Haiku 5.5","Самая быстрая"]];
var cur=0,files=[];
var $=function(i){return document.getElementById(i)};
var menu=$("menu"),pill=$("pill"),inp=$("inp"),send=$("send"),chat=$("chat");
function draw(){$("mopts").innerHTML="";models.forEach(function(m,i){
  var b=document.createElement("button");b.className="opt"+(i==cur?" sel":"");
  b.innerHTML="<span>"+m[0]+"<small>"+m[1]+"</small></span><i class='dot'></i>";
  b.onclick=function(){cur=i;$("mname").textContent=m[0];draw();toggle(false)};
  $("mopts").appendChild(b)})}
function toggle(s){menu.classList.toggle("show",s);pill.classList.toggle("open",s)}
pill.onclick=function(e){e.stopPropagation();toggle(!menu.classList.contains("show"))};
document.onclick=function(e){if(!menu.contains(e.target))toggle(false)};
draw();
function upd(){send.disabled=!inp.value.trim()&&!files.length;inp.style.height="auto";inp.style.height=inp.scrollHeight+"px"}
inp.oninput=upd;
inp.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(hover:hover)").matches){e.preventDefault();go()}};
$("plus").onclick=function(){$("file").click()};
$("file").onchange=function(e){Array.prototype.forEach.call(e.target.files,function(f){files.push(f.name)});e.target.value="";chips();upd()};
function chips(){$("chips").innerHTML=files.map(function(n){return "<span class='att'>"+esc(n)+"</span>"}).join("")}
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function add(cls,html){var d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"});return d}
function go(){
  var t=inp.value.trim();if(!t&&!files.length)return;
  if($("empty"))$("empty").remove();
  var a=files.map(function(n){return "<span class='att'>"+esc(n)+"</span>"}).join("");
  var c=ensure(t||files[0]);var mh=a+(a&&t?"<br>":"")+esc(t);c.msgs.push({cls:"me",html:mh});add("me",mh);saveSide();
  files=[];chips();inp.value="";upd();
  var name=models[cur][0];
  var w=add("ai","<b>"+name+"</b><div class='typing'><span></span><span></span><span></span></div>");
  setTimeout(function(){var rh="<b>"+name+" · "+lv[ef]+"</b>Это демо-ответ. Настоящие модели подключим к боту следующим шагом.";w.innerHTML=rh;c.msgs.push({cls:"ai",html:rh});saveSide()},1300);
}
send.onclick=go;
var chats=[],projects=[],active=null,tab="chats",openP={},adding=false,pend=null;
try{var sv=JSON.parse(localStorage.getItem("cf")||"{}");chats=sv.c||[];projects=sv.p||[]}catch(e){}
function saveSide(){try{localStorage.setItem("cf",JSON.stringify({c:chats,p:projects}))}catch(e){}renderSide()}
function cur_(){return chats.filter(function(x){return x.id===active})[0]}
function ensure(t){var c=cur_();if(!c){c={id:Date.now(),title:String(t||"Новый чат").slice(0,40),project:pend,msgs:[]};chats.unshift(c);active=c.id;pend=null}return c}
function show(){chat.innerHTML="";var c=cur_();if(!c||!c.msgs.length){chat.innerHTML="<div class='empty' id='empty'>"+(pend?"Новый чат в проекте":"Привет! О чём поговорим?")+"</div>"}else c.msgs.forEach(function(m){add(m.cls,m.html)})}
function el(p,tag,cls,txt,fn){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;p.appendChild(e);return e}
function openSide(){$("side").classList.add("show");$("ov").classList.add("show");renderSide()}
function closeSide(){$("side").classList.remove("show");$("ov").classList.remove("show")}
function newChat(pid){active=null;pend=pid;show();closeSide();renderSide()}
function row(L,c,sub){var r=el(L,"div","rw"+(c.id===active?" act":"")+(sub?" sub":""));
 el(r,"button","item",c.title,function(){active=c.id;pend=null;show();closeSide();renderSide()});
 el(r,"button","x","×",function(){chats=chats.filter(function(z){return z.id!==c.id});if(active===c.id){active=null;show()}saveSide()})}
function renderSide(){var L=$("list");L.innerHTML="";
 $("tc").className="tab"+(tab==="chats"?" on":"");$("tp").className="tab"+(tab==="projects"?" on":"");
 if(tab==="chats"){if(!chats.length)el(L,"div","hint","Пока нет чатов. Напишите первое сообщение.");chats.forEach(function(c){row(L,c)})}
 else{el(L,"button","item plus","+ Новый проект",function(){adding=true;renderSide()});
  if(adding){var i=el(L,"input","pinp");i.placeholder="Название проекта";i.onkeydown=function(e){if(e.key==="Enter"&&i.value.trim()){projects.unshift({id:Date.now(),name:i.value.trim()});openP[projects[0].id]=true;adding=false;saveSide()}else if(e.key==="Escape"){adding=false;renderSide()}};setTimeout(function(){i.focus()},0)}
  projects.forEach(function(p){var r=el(L,"div","rw");
   el(r,"button","item",(openP[p.id]?"▾ ":"▸ ")+p.name,function(){openP[p.id]=!openP[p.id];renderSide()});
   el(r,"button","x","×",function(){projects=projects.filter(function(z){return z.id!==p.id});chats.forEach(function(c){if(c.project===p.id)c.project=null});saveSide()});
   if(openP[p.id]){el(L,"button","item plus","+ Чат в проекте",function(){newChat(p.id)}).style.marginLeft="14px";chats.filter(function(c){return c.project===p.id}).forEach(function(c){row(L,c,1)})}});
  if(!projects.length&&!adding)el(L,"div","hint","Проекты собирают чаты по теме.")}}
$("burger").onclick=function(e){e.stopPropagation();openSide()};
$("ov").onclick=closeSide;
$("nc").onclick=function(){newChat(null)};
$("tc").onclick=function(){tab="chats";renderSide()};
$("tp").onclick=function(){tab="projects";renderSide()};
var lv=["Низкое","Среднее","Высокое","Очень высокое","Максимум"],ef=1;
var hit=$("hit"),trk=$("trk");
function buz(n){try{if(navigator.vibrate)navigator.vibrate(n)}catch(e){}}
function paint(){var p=ef*25;$("thumb").style.left=p+"%";$("fill").style.width=p+"%";$("elv").textContent=lv[ef]}
function pick(x){var r=trk.getBoundingClientRect();var i=Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*4);if(i!==ef){ef=i;buz(18);paint()}}
hit.onpointerdown=function(e){hit.setPointerCapture(e.pointerId);hit.classList.add("down");buz(8);pick(e.clientX)};
hit.onpointermove=function(e){if(hit.classList.contains("down"))pick(e.clientX)};
function up(){if(hit.classList.contains("down")){hit.classList.remove("down");buz(8)}}
hit.onpointerup=up;hit.onpointercancel=up;
var sites=[{n:"Claude.ai",d:"Официальный бесплатный план",u:"https://claude.ai"}];
var smenu=$("smenu");
function sToggle(s){smenu.classList.toggle("show",s)}
function drawSites(msg){var L=$("slist");L.innerHTML="";sites.forEach(function(s){var a=el(L,"a","opt");a.href=s.u;a.target="_blank";a.rel="noopener";var sp=document.createElement("span");sp.textContent=s.n;if(s.p||(s.d&&/платн|paywall|subscription|premium|деньг|оплат|подписк/i.test(s.d))){var badge=document.createElement("small");badge.style.color="var(--accent)";badge.style.fontWeight="600";badge.textContent=" · платный";sp.appendChild(badge)}var sm=document.createElement("small");sm.textContent=s.d;sp.appendChild(sm);a.appendChild(sp)});if(msg)el(L,"div","hint",msg)}
$("gl").onclick=function(e){e.stopPropagation();toggle(false);sToggle(!smenu.classList.contains("show"))};
pill.addEventListener("click",function(){sToggle(false)});
document.addEventListener("click",function(e){if(!smenu.contains(e.target))sToggle(false)});
var API=new URLSearchParams(location.search).get("api")||"https://ctepochkin-claude.hf.space";
function fail(m){$("rf").classList.remove("spin");drawSites(m)}
function load(){
 var b=$("rf");b.classList.add("spin");
 if(!API){fail("Не указан адрес сервера поиска (параметр ?api= в ссылке).");return}
 var base=API.replace(/\/$/,"");
 function call(p){return fetch(base+p+"/call/sites",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:[]})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return fetch(base+p+"/call/sites/"+j.event_id)}).then(function(r){return r.text()})}
 call("/gradio_api").catch(function(){return call("")}).then(function(t){
  var m=t.match(/event: complete\s+data: (.*)/);var d=JSON.parse(m[1])[0];
  if(!Array.isArray(d)){fail(d&&d.error?d.error:"Поиск не сработал.");return}
  sites=[sites[0]].concat(d);$("rf").classList.remove("spin");
  drawSites(d.length?"Результаты поиска не проверены. Не вводи пароли и данные карты.":"Ничего не найдено.");
 }).catch(function(){fail("Сервер поиска не отвечает. Проверь, что Space запущен.")})
}
$("rf").onclick=function(e){e.stopPropagation();load()};
drawSites();if(API)load();
paint();
renderSide();show();
</script>
</body>
</html>
